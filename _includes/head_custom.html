<script>
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-color-scheme', saved);
</script>

<style>
  [data-color-scheme="light"] {
    filter: invert(1) hue-rotate(180deg);
  }
  [data-color-scheme="light"] img {
    filter: invert(1) hue-rotate(180deg);
  }
</style>
