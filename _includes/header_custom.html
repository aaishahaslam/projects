<button onclick="
  document.body.classList.toggle('light-mode');
  localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
  this.textContent = document.body.classList.contains('light-mode') ? '🌙 Dark Mode' : '☀️ Light Mode';
" style="margin:1rem; padding:0.4rem 0.8rem; cursor:pointer; border-radius:6px; border:1px solid #ccc; background:transparent; color:inherit;">☀️ Light Mode</button>

<script>
  if (localStorage.getItem('theme') === 'light') {
    document.body.classList.add('light-mode');
  }
</script>
